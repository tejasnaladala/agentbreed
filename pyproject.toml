[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbreed"
version = "0.1.0"
description = "Evolve any AI agent through Darwinian selection. pip install and add 3 lines to your project."
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "agents", "evolution", "breeding", "darwinian", "llm", "optimization"]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
cli = ["click>=8.0", "rich>=13.0"]
anthropic = ["anthropic>=0.52.0"]
openai = ["openai>=1.30"]
charts = ["matplotlib>=3.8"]
all = [
    "click>=8.0",
    "rich>=13.0",
    "anthropic>=0.52.0",
    "openai>=1.30",
    "matplotlib>=3.8",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
breed = "breed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["breed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
