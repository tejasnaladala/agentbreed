[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbreed"
version = "0.1.0"
description = "Evolve AI agents through Darwinian selection. Track lineage. Benchmark generations."
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "agents", "evolution", "breeding", "darwinian", "llm", "optimization"]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.52.0"]
openai = ["openai>=1.30"]
crewai = ["crewai>=0.50"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
charts = ["matplotlib>=3.8"]
all = [
    "anthropic>=0.52.0",
    "openai>=1.30",
    "crewai>=0.50",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "matplotlib>=3.8",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
breed = "breed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["breed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
